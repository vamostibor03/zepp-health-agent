name: Daily Health Report

on:
  schedule:
    # 08:30 UTC = 10:30 in Berlin during summer (CEST, UTC+2).
    # Note: GitHub cron is ALWAYS UTC and does NOT follow DST, so in winter
    # (CET, UTC+1) this fires at 09:30 local. Change to "30 9 * * *" if you
    # want 10:30 local in winter instead.
    # The :30 minute (off the top of the hour) also makes GitHub far less
    # likely to delay/drop the run, since :00 is the most contended slot.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Report mode"
        type: choice
        options: [daily, prev-day]
        default: daily
      date:
        description: "Target date (YYYY-MM-DD, blank = yesterday)"
        required: false
        default: ""
      backfill:
        description: "Backfill this many days of history first"
        required: false
        default: "0"

# Allow the workflow to push the updated database back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-health-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          ZEPP_APP_TOKEN: ${{ secrets.ZEPP_APP_TOKEN }}
          ZEPP_USER_ID: ${{ secrets.ZEPP_USER_ID }}
          ZEPP_EMAIL: ${{ secrets.ZEPP_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          ZEPP_REGION: ${{ secrets.ZEPP_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Empty when the secret is undefined; config.py drops it so the SDK
          # falls back to its default endpoint instead of a scheme-less URL.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          DATABASE_PATH: data/health.db
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          BACKFILL="${{ github.event.inputs.backfill || '0' }}"
          python -m watchdata.main --mode "$MODE" --backfill "$BACKFILL" $DATE_ARG

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/health.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          git commit -m "chore: update health history [skip ci]"
          # The remote may have advanced since checkout (e.g. a manual push or a
          # previous run). Rebase onto the latest main and retry so we never fail
          # with a non-fast-forward rejection.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main and retrying."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "Failed to push updated history after multiple attempts." >&2
          exit 1
